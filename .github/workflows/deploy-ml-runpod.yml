# CI/CD for the GPU worker: build the ml-service image, push to GHCR, then
# bounce the RunPod pod so its next start pulls :latest. The pod is ON-DEMAND
# (not serverless): stop/start recreates the container from the image while
# the volume (model weight + TensorRT engine cache) survives.
#
# Required repo secrets for the deploy job (build+push works without them):
#   RUNPOD_API_KEY  — RunPod API key with pod control
#   RUNPOD_POD_ID   — the ml-service pod's id
name: deploy-ml-runpod

on:
  push:
    branches: [main]
    paths:
      - "services/ml-service/**"
      - ".github/workflows/deploy-ml-runpod.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/ml-service" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: services/ml-service
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  restart-pod:
    needs: build-push
    runs-on: ubuntu-latest
    # Skips cleanly when the RunPod secrets are not configured.
    if: ${{ vars.RUNPOD_DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Stop pod
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.RUNPOD_API_KEY }}" \
            "https://rest.runpod.io/v1/pods/${{ secrets.RUNPOD_POD_ID }}/stop" || true
      - name: Wait for pod to stop
        run: |
          for i in $(seq 1 30); do
            status=$(curl -sf -H "Authorization: Bearer ${{ secrets.RUNPOD_API_KEY }}" \
              "https://rest.runpod.io/v1/pods/${{ secrets.RUNPOD_POD_ID }}" | jq -r .desiredStatus)
            echo "pod status: $status"
            [ "$status" = "EXITED" ] && exit 0
            sleep 5
          done
          echo "pod did not stop in time" >&2; exit 1
      - name: Start pod (pulls :latest)
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.RUNPOD_API_KEY }}" \
            "https://rest.runpod.io/v1/pods/${{ secrets.RUNPOD_POD_ID }}/start"
