# CI/CD for the application: deploy api-service + frontend to Railway on
# every push to main. Postgres (TimescaleDB image service) and Redis live in
# the same Railway project; media bytes live in R2/S3 (see docs/deployment.md).
#
# Required repo secret: RAILWAY_TOKEN (project token).
# Required repo vars: RAILWAY_API_SERVICE, RAILWAY_FRONTEND (service names).
name: deploy-railway

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-railway.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.RAILWAY_DEPLOY_ENABLED == 'true' }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy api-service
        run: railway up --service "${{ vars.RAILWAY_API_SERVICE }}" --ci
      - name: Deploy frontend
        run: railway up --service "${{ vars.RAILWAY_FRONTEND }}" --ci
